<md-input-container class="md-block flex-gt-sm">
  <label>{{$ctrl.translate('alerts.condition.threshold')}}</label>
  <input
    ng-model="$ctrl.condition.threshold"
    required
    type="number"
    min="1"
    name="threshold"
    aria-label="{{$ctrl.translate('alerts.condition.thresholdAria')}}"
    ng-disabled="$ctrl.isReadonly"
  />
  <!--
  <div class="hint">
    The threshold value to compare to.
  </div>
  -->
  <div ng-messages="$ctrl.formAlert.threshold.$error">
    <div ng-message="required">{{$ctrl.translate('alerts.condition.thresholdRequired')}}</div>
    <div ng-message="min">{{$ctrl.translate('alerts.condition.thresholdMin')}}</div>
  </div>
</md-input-container>
