<div layout="row">
  <md-input-container class="md-block" flex-gt-sm flex="30">
    <label>{{$ctrl.translate('alerts.condition.multiplier')}}</label>
    <input
      ng-model="$ctrl.condition.multiplier"
      required
      type="number"
      min="1"
      name="condition-compare-multiplier"
      aria-label="{{$ctrl.translate('alerts.condition.multiplierAria')}}"
      ng-disabled="$ctrl.isReadonly"
    />
    <div ng-messages="$ctrl.formAlert['condition-compare-multiplier'].$error">
      <div ng-message="required">{{$ctrl.translate('alerts.condition.multiplierRequired')}}</div>
      <div ng-message="min">{{$ctrl.translate('alerts.condition.multiplierMin')}}</div>
    </div>
  </md-input-container>

  <md-input-container class="md-block" flex-gt-sm flex="30">
    <label>{{$ctrl.translate('alerts.condition.property')}}</label>
    <md-select
      ng-model="$ctrl.condition.property2"
      required
      name="condition-compare-property"
      aria-label="{{$ctrl.translate('alerts.condition.propertyAria')}}"
      ng-disabled="$ctrl.isReadonly"
    >
      <md-option ng-value="type.key" ng-repeat="type in $ctrl.metrics"> {{$ctrl.translate('alerts.metrics.' + type.key)}} </md-option>
    </md-select>
    <div ng-messages="$ctrl.formAlert['condition-compare-property'].$error">
      <div ng-message="required">{{$ctrl.translate('alerts.condition.propertyRequired')}}</div>
    </div>
  </md-input-container>
</div>
