<div layout="column">
  <md-switch ng-model="$ctrl.isCustomField" aria-label="{{$ctrl.translate('settings.analytics.editor.customField')}}"
    >{{$ctrl.translate('settings.analytics.editor.customField')}}</md-switch
  >

  <div layout="row">
    <md-input-container ng-show="!$ctrl.isCustomField">
      <label>{{$ctrl.translate('settings.analytics.editor.field')}}</label>
      <md-select ng-model="$ctrl.field" ng-change="$ctrl.onFieldChanged()">
        <md-option ng-repeat="field in $ctrl.fields" ng-value="field.value">{{field.label}}</md-option>
      </md-select>
    </md-input-container>

    <md-input-container ng-show="$ctrl.isCustomField">
      <label>{{$ctrl.translate('settings.analytics.editor.field')}}</label>
      <input name="Field" ng-model="$ctrl.field" ng-change="$ctrl.onFieldChanged()" />
    </md-input-container>
  </div>
</div>

<div layout="row">
  <md-input-container>
    <label>{{$ctrl.translate('settings.analytics.editor.projection')}}</label>
    <md-select ng-model="$ctrl.projection" ng-change="$ctrl.onProjectionChanged()">
      <md-option ng-repeat="projection in $ctrl.projections" ng-value="projection.value">{{projection.label}}</md-option>
    </md-select>
  </md-input-container>

  <md-input-container>
    <label>{{$ctrl.translate('settings.analytics.editor.order')}}</label>
    <md-select ng-model="$ctrl.order" ng-change="$ctrl.onProjectionChanged()">
      <md-option ng-repeat="order in $ctrl.projectionOrders" ng-value="order.value">{{order.label}}</md-option>
    </md-select>
  </md-input-container>
</div>

<div layout="column">
  <md-input-container>
    <md-checkbox ng-model="$ctrl.chart.percent" ng-disabled="$ctrl.projection !== '_count'">
      {{$ctrl.translate('settings.analytics.editor.percent')}}
    </md-checkbox>
  </md-input-container>

  <md-input-container>
    <md-checkbox ng-model="$ctrl.chart.selectable"> {{$ctrl.translate('settings.analytics.editor.selectableRow')}} </md-checkbox>
  </md-input-container>

  <md-input-container>
    <label>{{$ctrl.translate('settings.analytics.editor.paging')}}</label>
    <input type="number" ng-model="$ctrl.chart.paging" min="5" max="100" required />
  </md-input-container>
</div>
