<mat-card>
  <mat-card-content>
    <div class="api-creation-get-started__header">
      <h1 class="api-creation-get-started__header__title mat-headline-6">{{ 'apis.creation.title' | translate }}</h1>
      <span class="api-creation-get-started__header__description mat-body">{{ 'apis.creation.subtitle' | translate }}</span>
    </div>

    <div class="api-creation-get-started__row">
      <div class="api-creation-get-started__row__card">
        <div>
          <mat-icon svgIcon="gio:rocket"></mat-icon>
          <div class="mat-subtitle-1">{{ 'apis.creation.classic.title' | translate }}</div>
          <div class="mat-body">{{ 'apis.creation.classic.description' | translate }}</div>
        </div>

        <div class="api-creation-get-started__row__card__action">
          <button mat-flat-button [routerLink]="'./v2'" color="primary">{{ 'apis.creation.classic.createV2' | translate }}</button>
          <button mat-stroked-button (click)="goToApiImport()">{{ 'apis.creation.classic.importV2' | translate }}</button>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
