    name: gravitee_41220_data-elasticsearch
  data-mongo:
    name: gravitee_41220_data-mongo
  apim-mongodb-logs:
    name: gravitee_41220_apim-mongodb-logs
  apim-gateway-logs:
    name: gravitee_41220_apim-gateway-logs
  apim-management-api-logs:
    name: gravitee_41220_apim-management-api-logs
  apim-management-ui-logs:
    name: gravitee_41220_apim-management-ui-logs
  apim-portal-ui-logs:
    name: gravitee_41220_apim-portal-ui-logs
